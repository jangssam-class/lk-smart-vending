<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>전국 포스팅 제목 생성기</title><link rel="stylesheet" href="style.css"><style>.ms{max-width:1150px;margin:auto;padding:60px 22px}.ms h1{font-size:clamp(38px,6vw,68px)}.gen{display:grid;grid-template-columns:.65fr 1.35fr;border:1px solid #ddd}.ctrl{background:#f5f5f3;padding:26px;display:grid;gap:13px}.ctrl select,.ctrl input{width:100%;padding:12px;margin-top:6px}.out{padding:28px}.gt{padding:16px;border:1px solid #111;margin:9px 0;font-weight:800;cursor:pointer}.gt:hover{background:#080808;color:white}.mk{display:flex;flex-wrap:wrap;gap:6px}.mk span{font-size:10px;border:1px solid #ddd;padding:7px}@media(max-width:700px){.gen{grid-template-columns:1fr}}</style></head><body><main class="ms"><a href="/index.html">← 홈페이지</a> &nbsp; <a href="/admin/" style="font-weight:800">포스팅 작성하기 →</a><p class="eyebrow" style="margin-top:35px">LOCAL CONTENT TOOL</p><h1>전국 포스팅 제목 생성기</h1><p>지역·제품·설치 공간을 조합해 제목 후보와 연관 키워드를 만듭니다.</p><div class="gen"><div class="ctrl"><label>시·도<select id="p"></select></label><label>시·군·구<select id="c"></select></label><label>읍·면·동<input id="d" placeholder="예: 재송동"></label><label>제품<select id="prod"><option>냉동자판기</option><option>무인자판기</option><option>멀티자판기</option><option>스마트자판기</option><option>무인판매기</option></select></label><label>용도<select id="use"><option>음료 간식</option><option>사무실 간식</option><option>공장 간편식</option><option>병원 편의상품</option><option>헬스장 음료</option><option>호텔 편의상품</option></select></label></div><div class="out"><h2>추천 제목</h2><div id="titles"></div><p>제목을 클릭하면 복사됩니다.</p><div class="mk" id="kws"></div></div></div></main><script>const R={"서울": ["강남구", "서초구", "송파구", "마포구", "영등포구", "강서구", "관악구", "노원구"], "부산": ["해운대구", "수영구", "동래구", "부산진구", "남구", "연제구", "금정구", "사상구", "사하구", "기장군"], "대구": ["수성구", "달서구", "달성군", "중구", "동구", "북구"], "인천": ["남동구", "연수구", "부평구", "서구", "미추홀구", "계양구"], "광주": ["광산구", "북구", "서구", "남구", "동구"], "대전": ["유성구", "서구", "중구", "동구", "대덕구"], "울산": ["남구", "중구", "북구", "동구", "울주군"], "세종": ["세종시"], "경기": ["수원시", "성남시", "용인시", "고양시", "화성시", "부천시", "남양주시", "안산시", "평택시", "김포시", "파주시", "시흥시"], "강원": ["춘천시", "원주시", "강릉시", "속초시", "동해시", "삼척시"], "충북": ["청주시", "충주시", "제천시", "진천군", "음성군"], "충남": ["천안시", "아산시", "서산시", "당진시", "공주시", "보령시"], "전북": ["전주시", "익산시", "군산시", "정읍시", "완주군"], "전남": ["목포시", "여수시", "순천시", "나주시", "광양시"], "경북": ["포항시", "경주시", "구미시", "경산시", "안동시", "김천시"], "경남": ["창원시", "김해시", "양산시", "진주시", "거제시", "통영시"], "제주": ["제주시", "서귀포시"]};const p=document.getElementById('p'),c=document.getElementById('c');function fc(){c.innerHTML=R[p.value].map(x=>`<option>${x}</option>`).join('');g()}function g(){let l=[p.value,c.value,d.value.trim()].filter(Boolean).join(' '),pr=prod.value,u=use.value,alt=pr==='냉동자판기'?'무인 멀티자판기':'냉동자판기 멀티자판기';let ts=[`${l} ${pr} 설치 렌탈 ${alt} 운영사례 ${u}`,`${l} ${pr} 설치 무인자판기 렌탈 비용 운영방법 ${u}`,`${l} 무인자판기 설치 ${pr} 멀티자판기 렌탈 운영사례`,`${l} ${u} 자판기 설치 ${pr} 무인판매기 운영사례`,`${l} 스마트자판기 설치 렌탈 ${pr} 상품구성 운영방법`];titles.innerHTML=ts.map(t=>`<div class="gt">${t}</div>`).join('');document.querySelectorAll('.gt').forEach(e=>e.onclick=()=>navigator.clipboard.writeText(e.textContent));let ks=[`${l} ${pr}`,`${l} 자판기 설치`,`${l} 자판기 렌탈`,`${l} 무인자판기`,`${l} 멀티자판기`,`${l} 무인판매기`];kws.innerHTML=ks.map(k=>`<span>${k}</span>`).join('')}p.innerHTML=Object.keys(R).map(x=>`<option>${x}</option>`).join('');p.value='부산';p.onchange=fc;c.onchange=g;[d,prod,use].forEach(e=>e.addEventListener(e===d?'input':'change',g));fc();</script></body></html>
