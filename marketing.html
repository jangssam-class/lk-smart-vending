<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>전국 지역 마케팅 포스팅 도구</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f6f6f4}.ms{max-width:1240px;margin:auto;padding:50px 22px 90px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.top a{font-weight:800}.ms h1{font-size:clamp(38px,6vw,68px);letter-spacing:-.06em;margin:25px 0 10px}.gen{display:grid;grid-template-columns:380px 1fr;border:1px solid #ddd;background:#fff;margin-top:35px}.ctrl{background:#111;color:#fff;padding:28px;display:grid;gap:15px}.ctrl label{font-size:12px;font-weight:800}.ctrl select,.ctrl input{width:100%;padding:13px;margin-top:7px;border:0}.out{padding:30px}.gt{padding:17px;border:1px solid #ddd;margin:9px 0;font-weight:800;cursor:pointer;line-height:1.45}.gt:hover{border-color:#111}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.actions button,.actions a{border:1px solid #111;background:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.actions .primary{background:#111;color:#fff}.mk{display:flex;flex-wrap:wrap;gap:6px}.mk span{font-size:11px;border:1px solid #ddd;padding:8px}.guide{margin-top:25px;background:#f7f7f5;padding:22px}.guide h3{margin-top:0}.guide li{margin:9px 0;line-height:1.55}@media(max-width:800px){.gen{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="ms"><div class="top"><a href="/">← 홈페이지</a><a href="/admin/">CMS 포스팅 작성 →</a></div><p class="eyebrow" style="margin-top:35px">LOCAL CONTENT TOOL V2</p><h1>전국 지역 마케팅<br>포스팅 설계 도구</h1><p>검색하는 사람이 실제로 사용할 지역·제품·설치 의도 키워드를 조합합니다. 같은 제목·본문을 지역명만 바꿔 반복 발행하는 방식은 피하세요.</p><div class="gen"><div class="ctrl"><label>시·도<select id="p"></select></label><label>시·군·구<select id="c"></select></label><label>읍·면·동<input id="d" placeholder="예: 재송동"></label><label>제품<select id="prod"><option>냉동자판기</option><option>무인자판기</option><option>멀티자판기</option><option>스마트자판기</option><option>무인판매기</option></select></label><label>설치 공간<select id="place"><option>오피스</option><option>병원</option><option>헬스장</option><option>학교·학원</option><option>공장</option><option>호텔·숙박</option><option>아파트</option><option>무인매장</option><option>기타 시설</option></select></label><label>콘텐츠 유형<select id="type"><option>설치 가이드</option><option>운영사례</option><option>렌탈 안내</option><option>비용 체크</option><option>상품 구성</option><option>운영 방법</option></select></label></div><div class="out"><h2>추천 제목</h2><div id="titles"></div><div class="actions"><button class="primary" id="copyBest">1번 제목 복사</button><button id="copyDesc">검색 설명문 복사</button><a href="/admin/">CMS에서 글 작성</a></div><h3>추천 검색 설명문</h3><div class="gt" id="desc"></div><h3>연관 키워드</h3><div class="mk" id="kws"></div><div class="guide"><h3>본문 구성 추천</h3><ol id="outline"></ol></div></div></div></main><script>
const R={"서울":["강남구","서초구","송파구","마포구","영등포구","강서구","관악구","노원구"],"부산":["해운대구","수영구","동래구","부산진구","남구","연제구","금정구","사상구","사하구","기장군"],"대구":["수성구","달서구","달성군","중구","동구","북구"],"인천":["남동구","연수구","부평구","서구","미추홀구","계양구"],"광주":["광산구","북구","서구","남구","동구"],"대전":["유성구","서구","중구","동구","대덕구"],"울산":["남구","중구","북구","동구","울주군"],"세종":["세종시"],"경기":["수원시","성남시","용인시","고양시","화성시","부천시","남양주시","안산시","평택시","김포시","파주시","시흥시"],"강원":["춘천시","원주시","강릉시","속초시","동해시","삼척시"],"충북":["청주시","충주시","제천시","진천군","음성군"],"충남":["천안시","아산시","서산시","당진시","공주시","보령시"],"전북":["전주시","익산시","군산시","정읍시","완주군"],"전남":["목포시","여수시","순천시","나주시","광양시"],"경북":["포항시","경주시","구미시","경산시","안동시","김천시"],"경남":["창원시","김해시","양산시","진주시","거제시","통영시"],"제주":["제주시","서귀포시"]};
const $=id=>document.getElementById(id),p=$('p'),c=$('c'),d=$('d'),prod=$('prod'),place=$('place'),type=$('type');let current=[];
function fc(){c.innerHTML=R[p.value].map(x=>`<option>${x}</option>`).join('');g()}
function g(){const loc=[p.value,c.value,d.value.trim()].filter(Boolean).join(' '),pr=prod.value,pl=place.value,tp=type.value;current=[`${loc} ${pr} 설치 렌탈 무인 멀티자판기 ${tp}`,`${loc} ${pr} 설치 ${pl} 무인자판기 렌탈 운영방법`,`${loc} 무인자판기 설치 ${pr} 멀티자판기 ${pl} ${tp}`,`${loc} ${pl} 자판기 설치 렌탈 상품구성 운영 포인트`,`${loc} 스마트자판기 ${pr} 설치 전 확인할 비용 공간 상품 구성`];$('titles').innerHTML=current.map((t,i)=>`<div class="gt" data-i="${i}">${i+1}. ${t}</div>`).join('');document.querySelectorAll('#titles .gt').forEach(e=>e.onclick=()=>navigator.clipboard.writeText(current[+e.dataset.i]));const ds=`${loc}에서 ${pr} 설치나 렌탈을 검토할 때 확인할 ${pl} 설치 공간, 상품 구성, 운영 방법과 상담 전 체크 포인트를 정리합니다.`;$('desc').textContent=ds;const ks=[`${loc} ${pr}`,`${loc} 자판기 설치`,`${loc} 자판기 렌탈`,`${c.value} 무인자판기`,`${d.value.trim()||c.value} 멀티자판기`,`${pl} 자판기 설치`,`${pr} 운영방법`,`${pr} 상품구성`];$('kws').innerHTML=ks.map(k=>`<span>${k}</span>`).join('');const ol=[`${loc}에서 ${pr}를 찾는 이유`,`설치 공간과 전기·동선 체크`,`이용자에 맞는 판매 상품 구성`,`렌탈·구매 상담 전에 확인할 항목`,`운영과 재고 관리 포인트`,`설치 상담 시 준비하면 좋은 정보`];$('outline').innerHTML=ol.map(x=>`<li>${x}</li>`).join('')}
p.innerHTML=Object.keys(R).map(x=>`<option>${x}</option>`).join('');p.value='부산';p.onchange=fc;c.onchange=g;[d,prod,place,type].forEach(e=>e.addEventListener(e===d?'input':'change',g));$('copyBest').onclick=()=>navigator.clipboard.writeText(current[0]||'');$('copyDesc').onclick=()=>navigator.clipboard.writeText($('desc').textContent);fc();
</script></body></html>
